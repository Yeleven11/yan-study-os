groups:
  - name: yan-study-os-service-alerts
    interval: 30s
    rules:
      - alert: YanStudyApiHighErrorRate
        expr: |
          (
            sum(rate(yan_study_api_requests_total{result="server_error"}[5m]))
            /
            clamp_min(sum(rate(yan_study_api_requests_total[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: page
          service: yan-study-os
        annotations:
          summary: "API error rate above 5%"
          description: "Server-error rate has exceeded 5% for 10 minutes."

      - alert: YanStudyApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(yan_study_api_request_latency_ms_bucket[5m]))
          ) > 1200
        for: 10m
        labels:
          severity: page
          service: yan-study-os
        annotations:
          summary: "API p95 latency above 1200ms"
          description: "The p95 latency has been above 1.2s for 10 minutes."

      - alert: YanStudyHealthIngestionFailureRateHigh
        expr: |
          (
            sum(rate(yan_study_health_ingestion_requests_total{result=~"server_error|client_error|unauthorized"}[10m]))
            /
            clamp_min(sum(rate(yan_study_health_ingestion_requests_total[10m])), 0.001)
          ) > 0.1
        for: 15m
        labels:
          severity: page
          service: yan-study-os
        annotations:
          summary: "Health ingestion failure rate above 10%"
          description: "Health ingestion failures are elevated for 15 minutes."

      - alert: YanStudyAuthFailureAnomaly
        expr: |
          (
            sum(rate(yan_study_auth_attempts_total{result=~"unauthorized|client_error"}[5m]))
            /
            clamp_min(sum(rate(yan_study_auth_attempts_total[5m])), 0.001)
          ) > 0.2
          and
          sum(increase(yan_study_auth_attempts_total{result=~"unauthorized|client_error"}[10m])) > 20
        for: 10m
        labels:
          severity: ticket
          service: yan-study-os
        annotations:
          summary: "Auth failures are anomalously high"
          description: "Authentication failures exceed expected baseline and volume."
